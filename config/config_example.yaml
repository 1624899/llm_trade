# LLM-TRADE example runtime configuration.
#
# Copy this file to config/config.yaml for local use, then provide secrets via
# environment variables or a root-level .env file. Do not commit real API keys.

system:
  test_mode: false

llm_models:
  deepseek:
    api_key: "env:DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-v4-flash"
    max_tokens: 8192
    temperature: 0.7

  qwen:
    api_key: "env:QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-turbo"
    max_tokens: 8000
    temperature: 0.7

active_llm: "deepseek"

agent_workflow:
  candidate_analysis_max_workers: 3

web_search:
  enabled: true
  provider: "tavily"
  fallback_provider: "duckduckgo"
  api_key: "env:TAVILY_API_KEY"
  endpoint: "https://api.tavily.com/search"
  topic: "finance"
  search_depth: "basic"
  include_answer: false
  cache_ttl_seconds: 21600
  timeout: 30
  max_results: 5

data:
  enable_cleanup: true
  derive_period_bars_on_sync: false
  backfill_history_on_sync: true
  enable_daily_bars_incremental_fill: true
  market_data_retention_days: 30
  macro_events_retention_days: 30
  output_retention_days: 30
  trade_execution_retention_days: 365
  daily_quotes_retention_days: 45
  market_bars_daily_retention_days: 3650
  market_bars_weekly_retention_days: 1825
  market_bars_monthly_retention_days: 3650
  daily_lhb_retention_days: 180
  market_signal_lookback_days: 7
  restricted_release_forward_days: 60
  concept_membership_top_n: 12
  baidu_profile_max_codes: 300
  baidu_fund_flow_max_codes: 120
  baidu_fund_flow_days: 20
  info_source_max_codes: 80
  research_report_pages: 2
  stock_news_limit: 20
  global_news_limit: 50
  announcement_lookback_days: 365
  announcement_limit: 30
  paper_trades_retention_days: 365
  mootdx_bar_offset: 900
  mootdx_history_offset: 5000
  mootdx_timeout: 15
  market_bars_history_start_date: "20000101"
  retry_times: 3
  timeout: 30
  max_workers: 5

indicators:
  ema:
    short: 12
    long: 20
  macd:
    fast: 12
    slow: 26
    signal: 9
  rsi:
    period_7: 7
    period_14: 14
  kdj:
    period: 9
    k_period: 3
    d_period: 3
  boll:
    period: 20
    std_dev: 2
  wr:
    period: 14

logging:
  level: "INFO"
  file: "logs/llm_trade.log"
  max_size: "10MB"
  backup_count: 5
